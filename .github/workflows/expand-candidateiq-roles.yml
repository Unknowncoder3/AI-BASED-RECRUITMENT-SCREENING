name: Expand CandidateIQ roles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand-roles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand role catalog
        env:
          TARGET: frontend/src/CandidateIQApp.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/CandidateIQApp.jsx")
          text = path.read_text(encoding="utf-8")

          old = 'const roles={"Data Scientist":{sql:25,dsa:15,domain:"ML / Statistics",skills:"Python, SQL, Machine Learning"},"Data Analyst":{sql:40,dsa:10,domain:"Analytics / Statistics",skills:"SQL, Python, Statistics"},"Software Engineer":{sql:5,dsa:45,domain:"CS Fundamentals",skills:"C++, Java, Python, DSA"},"Backend Developer":{sql:15,dsa:30,domain:"APIs / Systems",skills:"Java, Python, SQL"},"ML Engineer":{sql:15,dsa:20,domain:"ML / Systems",skills:"Python, ML, Docker"},"Embedded Engineer":{sql:0,dsa:10,domain:"Embedded / Electronics",skills:"C, C++, Microcontrollers"}};'

          new = 'const roles={"Data Scientist":{sql:25,dsa:15,domain:"ML / Statistics",skills:"Python, SQL, Machine Learning"},"Data Analyst":{sql:40,dsa:10,domain:"Analytics / Statistics",skills:"SQL, Python, Statistics"},"Software Engineer":{sql:5,dsa:45,domain:"CS Fundamentals",skills:"C++, Java, Python, DSA"},"Software Developer":{sql:5,dsa:40,domain:"Software Development",skills:"Java, Python, C++, DSA"},"Backend Developer":{sql:15,dsa:30,domain:"APIs / Systems",skills:"Java, Python, SQL"},"Frontend Developer":{sql:0,dsa:20,domain:"Web / UI Engineering",skills:"JavaScript, React, HTML, CSS"},"Full Stack Developer":{sql:15,dsa:35,domain:"Web / API Engineering",skills:"React, Node.js, APIs, SQL"},"Web Developer":{sql:5,dsa:20,domain:"Web Development",skills:"HTML, CSS, JavaScript, React"},"Mobile App Developer":{sql:5,dsa:25,domain:"Mobile Development",skills:"Android, Flutter, React Native"},"QA / Test Engineer":{sql:5,dsa:15,domain:"Quality Engineering",skills:"Test Cases, API Testing, Automation"},"Automation Test Engineer":{sql:10,dsa:20,domain:"Test Automation",skills:"Selenium, Playwright, API Testing, Python"},"DevOps Engineer":{sql:5,dsa:20,domain:"Cloud / DevOps",skills:"Linux, Docker, CI/CD, AWS"},"Cloud Engineer":{sql:5,dsa:20,domain:"Cloud Infrastructure",skills:"AWS, Azure, Linux, Networking"},"Data Engineer":{sql:30,dsa:30,domain:"Data Engineering",skills:"SQL, Python, ETL, Spark"},"ML Engineer":{sql:15,dsa:20,domain:"ML / Systems",skills:"Python, ML, Docker"},"AI Engineer":{sql:10,dsa:20,domain:"AI / ML Engineering",skills:"Python, ML, APIs, LLMs"},"Cybersecurity Analyst":{sql:5,dsa:15,domain:"Cybersecurity",skills:"Networking, Linux, Security, SIEM"},"Business Analyst":{sql:35,dsa:5,domain:"Business Analytics",skills:"SQL, Excel, Power BI, Requirements"},"Product Analyst":{sql:30,dsa:5,domain:"Product Analytics",skills:"SQL, Python, Experimentation"},"Embedded Engineer":{sql:0,dsa:10,domain:"Embedded / Electronics",skills:"C, C++, Microcontrollers"}};'

          if old not in text:
              raise SystemExit("Expected CandidateIQ role catalog was not found; no changes made.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit role catalog update and remove one-shot workflow
        run: |
          git config user.name "CandidateIQ Bot"
          git config user.email "candidateiq-bot@users.noreply.github.com"
          rm -f .github/workflows/expand-candidateiq-roles.yml
          git add frontend/src/CandidateIQApp.jsx .github/workflows/expand-candidateiq-roles.yml
          git commit -m "feat: expand CandidateIQ role catalog"
          git push
